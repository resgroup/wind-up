name: Lint and test

on:
  push:
    branches:
      - main
      # Also on v1, so the Zenodo data cache is saved under refs/heads/v1: a pull_request run can
      # only restore caches from its own ref, its base branch and the default branch, never from
      # another PR's ref.
      - v1
  # Lets the data cache be warmed on a branch by hand (Actions tab -> Run workflow).
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - v1

permissions:
  contents: read

env:
  # The Zenodo record the Hill of Towie loader downloads; keep in step with HOT_V2_RECORD_ID in
  # benchmarking/synthetic/sources/hill_of_towie.py.
  HOT_V2_RECORD_ID: "22662930"
  # Bump to rebuild the data cache from scratch -- needed when a test starts using a year the
  # cached run never downloaded, since a cache is only written on a miss of the exact key.
  ZENODO_CACHE_VERSION: v1

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: 'true'
    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}
    - name: 'Install project'
      run: |
        uv sync --frozen --all-extras --dev
    - name: "lint check"
      run: |
        uv run poe lint-check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The lock resolves pandas 2 on 3.10 (pandas 3 needs 3.11+) and pandas 3 on 3.13, so both are tested.
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: 'true'
    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}
    - name: 'Install project'
      run: |
        uv sync --frozen --all-extras --dev
    # The slow tests pull several 1.3-1.5 GB Hill of Towie year zips from Zenodo, which is the
    # dominant cost of this job and the source of its flakiness. Caching the download directory
    # keeps that off the wire, and carries the unpacked per-turbine parquets with it. Keyed on the
    # record id, so publishing a new datapack misses rather than serving the old data;
    # restore-keys lets a partially-populated cache seed the next run.
    #
    # Only branch runs (push / workflow_dispatch) save the cache; pull requests restore only. A
    # PR-saved copy is visible to that PR alone, and at ~10 GB each, per-PR copies would evict the
    # shared branch cache from the repo's cache quota.
    - name: 'Restore the Zenodo data cache'
      id: zenodo-cache
      uses: actions/cache/restore@v4
      with:
        # The loader's own default location, left outside the workspace so a multi-GB cache is
        # not walked by pytest collection, ruff or mypy.
        path: ~/temp/wind-up-benchmarking/data
        key: zenodo-hot-${{ env.HOT_V2_RECORD_ID }}-${{ env.ZENODO_CACHE_VERSION }}-${{ runner.os }}
        restore-keys: |
          zenodo-hot-${{ env.HOT_V2_RECORD_ID }}-${{ env.ZENODO_CACHE_VERSION }}-
    - name: "test"
      # The runner is dedicated to this job, so use all of it: -n auto is half the logical CPUs
      # locally (tests/conftest.py), which is not what a CI box wants.
      env:
        PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
      run: |
        uv run poe test
    - name: 'Save the Zenodo data cache'
      # Runs only after a passing test step (the default success() gate), so a half-finished
      # download is never frozen under the exact key, which later runs would hit and never re-save.
      if: github.event_name != 'pull_request' && steps.zenodo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/temp/wind-up-benchmarking/data
        key: ${{ steps.zenodo-cache.outputs.cache-primary-key }}

  # Single stable check name for the branch ruleset, independent of the job matrices.
  lint-and-test:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
    - name: Require all lint and test jobs to pass
      run: |
        test "${{ needs.lint.result }}" = "success"
        test "${{ needs.test.result }}" = "success"
