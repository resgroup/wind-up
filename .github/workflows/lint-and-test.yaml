name: Lint and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # v1 feature branches PR into v1 rather than main, so without this they get no CI at all.
      - v1

permissions:
  contents: read

env:
  # The Zenodo record the Hill of Towie loader downloads; keep in step with HOT_V2_RECORD_ID in
  # benchmarking/synthetic/sources/hill_of_towie.py.
  HOT_V2_RECORD_ID: "20204946"
  # Bump to rebuild the data cache from scratch -- needed when a test starts using a year the
  # cached run never downloaded, since a cache is only written on a miss of the exact key.
  ZENODO_CACHE_VERSION: v1

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v5
      with:
        lfs: 'true'
    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}
    - name: 'Install project'
      run: |
        uv sync --frozen --all-extras --dev
    - name: "lint check"
      run: |
        uv run poe lint-check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v5
      with:
        lfs: 'true'
    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}
    - name: 'Install project'
      run: |
        uv sync --frozen --all-extras --dev
    # The slow tests pull several 1.3-1.5 GB Hill of Towie year zips from Zenodo, which is the
    # dominant cost of this job and the source of its flakiness. Caching the download directory
    # keeps that off the wire, and carries the unpacked per-turbine parquets with it. Keyed on the
    # record id, so publishing a new datapack misses rather than serving the old data;
    # restore-keys lets a partially-populated cache seed the next run.
    - name: 'Restore the Zenodo data cache'
      uses: actions/cache@v4
      with:
        # The loader's own default location, left outside the workspace so a multi-GB cache is
        # not walked by pytest collection, ruff or mypy.
        path: ~/temp/wind-up-benchmarking/data
        key: zenodo-hot-${{ env.HOT_V2_RECORD_ID }}-${{ env.ZENODO_CACHE_VERSION }}-${{ runner.os }}
        restore-keys: |
          zenodo-hot-${{ env.HOT_V2_RECORD_ID }}-${{ env.ZENODO_CACHE_VERSION }}-
    - name: "test"
      # The runner is dedicated to this job, so use all of it: -n auto is half the logical CPUs
      # locally (tests/conftest.py), which is not what a CI box wants.
      env:
        PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
      run: |
        uv run poe test
